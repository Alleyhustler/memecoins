<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memecoin Portfolio Simulator</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Just+Me+Again+Down+Here&display=swap');

    body {
      font-family: "Share Tech Mono", monospace;
      background-color: #06070B;
      color: #cbe319;
      font-size: 0.95rem;
    }

    .font-custom {
      font-family: "Share Tech Mono", monospace;
    }

    .command-shell {
      font-family: "Share Tech Mono", monospace;
      background-color: #101114;
      border-radius: 8px;
      padding: 0.9rem;
      color: #cbe319;
      border: 1.5px solid #22242d;
    }

    .coin-entry input {
      background-color: #06070B;
      color: #00ff00;
    }

    .main-container {
      min-height: 100vh;
      padding: 0.75rem;
      max-width: 1080px;
    }

    .section {
      margin-bottom: 0.5rem;
    }

    .social-links {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .social-links img {
      width: 32px;
      height: 32px;
      cursor: pointer;
    }

    .ca-address {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 12px;
    }

    .gif-container {
      width: 100%;
      max-width: 280px;
      height: auto;
      background-color: #000000;
      border-radius: 7px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 0.75rem auto;
      margin-top: -8%;
    }

    .gif-container img {
      max-width: 100%;
      max-height: 100%;
    }

    .explanation-box {
      background-color: #101114;
      border: 1.5px solid #22242d;
      border-radius: 8px;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      text-align: center;
      font-size: 0.95rem;
    }

    input, button {
      font-size: 0.9rem;
      padding: 0.45rem 0.75rem !important;
    }

    h1 {
      font-size: 2.1rem !important;
    }

    h2 {
      font-size: 1.4rem !important;
      margin-bottom: 0.45rem !important;
    }

    .coin-entry {
      padding: 0.75rem !important;
      margin-bottom: 0.75rem !important;
    }

    .coin-entry input {
      padding: 0.4rem !important;
      margin-bottom: 0.4rem !important;
    }

    #portfolio-list li {
      padding: 0.75rem !important;
      margin-bottom: 0.4rem !important;
      font-size: 0.9rem;
    }

    canvas {
      max-height: 220px;
    }

    @media (min-width: 1024px) {
      .content-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 0.75rem;
      }
    }

    @media (max-width: 1023px) {
      .content-grid {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
    }

    /* Smaller spacing */
    .p-4 {
      padding: 1rem !important;
    }

    .mb-2 {
      margin-bottom: 0.5rem !important;
    }

    .mb-3 {
      margin-bottom: 0.75rem !important;
    }

    .mb-4 {
      margin-bottom: 1rem !important;
    }

    .max-h-60 {
      max-height: 260px !important;
    }

    .max-h-72 {
      max-height: 260px !important;
    }
  </style>
</head>

<body class="bg-black text-color: #cbe319 font-custom">
  <div class="main-container container mx-auto px-1">
    <!-- Header with Logo and Links -->
    <header class="flex flex-col md:flex-row justify-between items-center mb-2">
      <h1 class="text-center mb-1 md:mb-0 color: #cbe319">Portfolio Simualator</h1>
      
      <div class="social-links">
        <a href="https://x.com/port_terminal_" target="_blank"><img src="image-removebg-preview (9).png" alt="Twitter"></a>
        <a href="https://t.me/portsolana" target="_blank"><img src="image-removebg-preview (10).png" alt="Telegram"></a>
        <a href="https://pump.fun/profile/EYLzzZk3EvDeC3EzCTijkauQz6hy3CQmeunopC41LVHp?coins_sort=created_timestamp" target="_blank"><img src="Pump-Fun-Logo (1).png" alt="Pump.fun"></a>
        <span class="ca-address">CA: HERE</span>
      </div>
    </header>
    
    <!-- GIF Section - Moved to top -->
    <div class="gif-container">
      <img src="gfgd.gif" alt="Portfolio GIF">
    </div>
    
    <!-- Explanation Box -->
    <div class="explanation-box">
      <p class="font-bold text-base">Share your $PORT and let's see who has the biggest bag in the trenches!</p>
      <p class="text-base mt-1">Add your portfolio details below and compare with the community. LIVE</p>
    </div>

    <!-- Main Content -->
    <div class="content-grid">
      <!-- Input Section -->
      <div class="section bg-opacity-90 rounded-lg shadow-lg border border-opacity-90 col-span-2" style="background-color: #101114; border-color: #22242d;">
        <h2 class="text-white ml-2 mt-1">Add Portfolio</h2>
        <div class="command-shell mx-2 mb-2">
          <input id="nickname" type="text" placeholder="Nickname" class="w-full rounded text-green-500 text-sm mb-3" style="background-color: #06070B;">
          <div id="coins-container" class="max-h-60 overflow-y-auto"></div>
          <button onclick="addCoinEntry()" class="text-black font-custom text-base rounded w-full mb-2" style="background-color: #22242d; color: #cbe319;">
            ➕ Add Coin
          </button>
          <button onclick="addPortfolioEntry()" class="text-black font-custom text-base rounded w-full" style="background-color: #22242d; color: #cbe319;">
            💾 Share Portfolio
          </button>          
        </div>
      </div>

      <!-- Portfolio Overview -->
      <div class="section bg-opacity-90 rounded-lg shadow-lg border border-opacity-90" style="background-color: #101114; border-color: #22242d;">
        <h2 class="text-white ml-2 mt-1">Global Portfolio Overview</h2>
        <div class="px-2">
          <canvas id="portfolioChart" class="mb-2"></canvas>
          <div class="max-h-72 overflow-y-auto">
            <ul id="portfolio-list" class="list-none space-y-1"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAJ4nVAzTZE9PPO_rMXxShJ1PjRXX3lfSY",
      authDomain: "memecoin-port.firebaseapp.com",
      projectId: "memecoin-port",
      storageBucket: "memecoin-port.firebasestorage.app",
      messagingSenderId: "707693218177",
      appId: "1:707693218177:web:3110d7fa5fe267a9e00080"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function addPortfolioEntry() {
      const nickname = document.getElementById('nickname').value;
      const coins = document.querySelectorAll('.coin-entry');
      if (!nickname || coins.length === 0) {
        alert('Fill in all fields correctly.');
        return;
      }

      let totalValue = 0;
      let portfolio = [];

      coins.forEach(coin => {
        const ticker = coin.querySelector('.ticker').value;
        const amount = parseFloat(coin.querySelector('.amount').value);
        const price = parseFloat(coin.querySelector('.price').value);
        if (ticker && !isNaN(amount) && !isNaN(price)) {
          let entryValue = amount * price;
          totalValue += entryValue;
          portfolio.push({ ticker, amount, price, entryValue });
        }
      });

      if (portfolio.length === 0) return;

      try {
        await addDoc(collection(db, 'portfolios'), {
          nickname, portfolio, totalValue, timestamp: new Date()
        });
        // Clear form after successful submission
        document.getElementById('nickname').value = '';
        document.getElementById('coins-container').innerHTML = '';
        addCoinEntry(); // Add an empty coin entry for next use
      } catch (error) { 
        console.error('Error adding entry:', error); 
        alert('Failed to save portfolio: ' + error.message);
      }
    }

    function addCoinEntry() {
      const container = document.getElementById('coins-container');
      const div = document.createElement('div');
      div.className = 'coin-entry rounded-lg shadow-lg text-white';
      div.style.backgroundColor = '#101114';
      div.innerHTML = `
        <div class="flex justify-between items-start">
          <div class="flex-grow">
            <input type="text" class="ticker w-full rounded text-sm" style="background-color: #06070B;" placeholder="Ticker (e.g., DOGE)">
            <div class="flex gap-2 mt-2">
              <input type="number" class="amount w-full rounded text-sm" style="background-color: #06070B;" placeholder="Amount">
              <input type="number" class="price w-full rounded text-sm" style="background-color: #06070B;" placeholder="Price ($)">
            </div>
          </div>
          <button class="text-red-500 ml-2 text-base px-2" onclick="this.parentElement.parentElement.remove()">✖</button>
        </div>`;
      container.appendChild(div);
    }

    async function deleteEntry(id) {
      try {
        await deleteDoc(doc(db, "portfolios", id));
      } catch (error) {
        console.error('Error deleting entry:', error);
        alert('Failed to delete: ' + error.message);
      }
    }

    function loadPortfolioEntries() {
      const q = query(collection(db, 'portfolios'), orderBy('timestamp', 'desc'));
      onSnapshot(q, (snapshot) => {
        const portfolioList = document.getElementById('portfolio-list');
        portfolioList.innerHTML = '';

        let chartData = {}; // Stores total portfolio value per user

        snapshot.forEach((doc) => {
          const data = doc.data();
          chartData[data.nickname] = (chartData[data.nickname] || 0) + data.totalValue;

          const item = document.createElement('li');
          item.className = 'rounded-lg shadow-lg text-white';
          item.style.backgroundColor = '#101114';
          
          let coinDetails = '';
          if (data.portfolio && data.portfolio.length > 0) {
            coinDetails = '<div class="mt-0.5 text-xs text-gray-300">';
            data.portfolio.forEach(coin => {
              coinDetails += `<div>${coin.ticker}: ${coin.amount} @ $${coin.price.toFixed(4)} = $${coin.entryValue.toFixed(2)}</div>`;
            });
            coinDetails += '</div>';
          }
          
          item.innerHTML = `
            <div class="flex justify-between items-start">
              <div>
                <span class="font-bold text-sm">${data.nickname}</span>: ${data.totalValue.toFixed(2)}
                ${coinDetails}
              </div>
              <button class='text-red-500 text-base px-2' onclick="deleteEntry('${doc.id}')">✖</button>
            </div>`;
          portfolioList.appendChild(item);
        });

        updateChart(chartData);
      });
    }

    function updateChart(data) {
      const ctx = document.getElementById('portfolioChart').getContext('2d');

      // Destroy existing chart instance before creating a new one
      if (window.myChart) {
          window.myChart.destroy();
      }

      // Generate colors based on number of entries
      const colorPalette = [
        '#ff6384', '#36a2eb', '#ffce56', '#4bc0c0', '#9966ff', 
        '#ff9f40', '#c9cbcf', '#7cbb00', '#ffbb78', '#ff85ea'
      ];
      
      const backgroundColors = Object.keys(data).map((_, index) => 
        colorPalette[index % colorPalette.length]
      );

      window.myChart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: Object.keys(data), // User nicknames
          datasets: [{
            data: Object.values(data), // Total portfolio values
            backgroundColor: backgroundColors
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                color: '#fff',
                font: {
                  family: "'Just Me Again Down Here', cursive",
                  size: 13
                }
              }
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  const label = context.label || '';
                  const value = context.raw || 0;
                  return `${label}: $${value.toFixed(2)}`;
                }
              }
            }
          }
        }
      });
    }

    window.addPortfolioEntry = addPortfolioEntry;
    window.loadPortfolioEntries = loadPortfolioEntries;
    window.deleteEntry = deleteEntry;
    window.addCoinEntry = addCoinEntry;
    
    // Add initial coin entry on page load
    document.addEventListener('DOMContentLoaded', () => {
      loadPortfolioEntries();
      addCoinEntry();
    });
  </script>
</body>
</html>
